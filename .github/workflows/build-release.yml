name: Build Plugin ZIP

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Crea ZIP del plugin
        run: |
          PLUGIN_NAME="wp-inactivity-logout-pro"
          VERSION="${{ github.event.release.tag_name }}"
          ZIP_NAME="${PLUGIN_NAME}-${VERSION}.zip"
          
          mkdir -p "$PLUGIN_NAME"
          
          # Copia tutti i file del plugin nella cartella, escludendo elementi non necessari
          rsync -av --exclude='.git' \
                   --exclude='.github' \
                   --exclude='.gitignore' \
                   --exclude="$PLUGIN_NAME" \
                   --exclude='*.zip' \
                   ./ "$PLUGIN_NAME/"
          
          # Crea lo ZIP con il nome che include la versione
          zip -r "$ZIP_NAME" "$PLUGIN_NAME"
          
          # Salva il nome del file ZIP nelle variabili di ambiente
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Carica ZIP nella Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
